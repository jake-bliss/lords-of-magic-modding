# Ladder rung 4: the PBM encoder with a visible change, at a changed length.
#
# The same member as rung 3, with a clean rectangle -- x 260..380, y 60..420 -- filled with palette
# index 1. In this member's own CMAP index 1 is pure red (255, 0, 0), and the engine has already
# been observed rendering that index as red from this very member (mods/newgame-picslice,
# 2026-09-18), so the colour is not a fresh assumption.
#
# Two differences from that earlier run are the point. It is a FILL, so it merges runs and the
# member's length moves again; and its edges are straight, because a real encoder can end a run
# anywhere, whereas `tools/pbm_patch.py` could only repaint whole runs and left a ragged edge. A
# clean-edged stripe is therefore a thing the old mechanism could not have produced.
#
# The control is the rest of the screen: everything outside the stripe, including all four edges of
# the image, must render exactly as shipped.
#
# **Run 2026-09-20, and it passed.** The observer reported a clean straight-edged red stripe with
# the surrounding art intact and all four screen edges untouched. The member SHRANK, 302,432 ->
# 256,996, because a fill merges runs. Two things this settles that the 2026-09-18 `pbm_patch` run
# could not: the full ByteRun1 encoder survives the engine, and the dropped `TINY` thumbnail is
# safe -- that drop was justified from the corpus (128 of 1,045 shipped images carry no `TINY`),
# which is corpus inference, and it is now gameplay evidence. Straight edges are the tell:
# `pbm_patch.py` repaints whole runs and leaves a ragged edge, so this rectangle is a thing the old
# mechanism could not have produced. NOT established: a `TINY` regenerated rather than dropped.
id = "pic-newgame-stripe"
name = "Main menu, striped"
version = "0.1.0"
description = "Rung 4: a clean filled rectangle written through pbm.rs, changing the member's length."

base_profile = "vanilla"


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upscale Review</title>
<style>
  :root {
    --bg: #16181c; --panel: #1f2228; --line: #2e323a; --text: #e6e6e6; --dim: #9aa0aa;
    --accent: #e0b64a; --picked: #3fb27f; --keep: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  }
  header h1 { font-size: 15px; margin: 0; }
  header label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  select, button { background: #2a2e36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .progress { font-variant-numeric: tabular-nums; }
  .bar { width: 160px; height: 6px; background: #2a2e36; border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--picked); }
  .help { color: var(--dim); font-size: 12px; }
  main { padding: 12px 16px 80px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 10px 12px; }
  .card.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card h2 { font-size: 13px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .card h2 .state { font-weight: 400; color: var(--dim); }
  .card h2 .state.picked { color: var(--picked); }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 4px; }
  .tile { flex: none; border: 2px solid transparent; border-radius: 8px; padding: 4px; cursor: pointer; background: #15171a; text-align: center; }
  .tile:hover { border-color: #555b66; }
  .tile.chosen { border-color: var(--picked); background: #17261f; }
  .tile.chosen.orig { border-color: var(--keep); background: #182032; }
  .tile img { display: block; image-rendering: auto; }
  .tile.orig img { image-rendering: pixelated; }
  .tile .cap { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .tile.chosen .cap { color: var(--text); }
  .vp { width: 380px; height: 300px; overflow: hidden; position: relative; }
  .vp img { position: absolute; left: 0; top: 0; }
  .pending { display: grid; place-items: center; color: var(--dim); font-size: 12px; border: 1px dashed var(--line); }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  @media (max-width: 600px) { header { gap: 8px; } .help { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Upscale Review</h1>
  <label>Group <select id="group"><option value="">All</option><option value="portrait">Portraits</option><option value="building">Buildings</option><option value="keep">Keeps</option><option value="screen">Screens</option><option value="panel">Panels</option><option value="sky">Skies</option><option value="library">Library</option></select></label>
  <label>Show <select id="show"><option value="unpicked">Unpicked</option><option value="picked">Picked</option><option value="all">All</option></select></label>
  <label>Zoom <select id="zoom"><option value="detail">Detail (hover to pan)</option><option value="0.5">0.5x</option><option value="1">1x (game 2x)</option><option value="1.5">1.5x</option><option value="2" selected>2x</option></select></label>
  <span class="progress"><span id="count">0</span> / <span id="total">0</span> picked</span>
  <div class="bar"><div id="fill" style="width:0"></div></div>
  <label>Bulk <select id="bulkopt"></select><button id="bulk">Apply to all unpicked shown</button></label>
  <span class="help">Keys: <b>1-4</b> pick option, <b>0</b> keep original, <b>j/k</b> next/prev, <b>u</b> clear</span>
</header>
<main id="list"></main>
<script>
const LABELS = { approved: "Approved pipeline (palette)", original: "Original", ultrasharp: "UltraSharp", "ultrasharp-tta": "UltraSharp + TTA", anime2x: "animevideo 2x", anime4x: "animevideo 4x→2x" };
let state = { options: [], images: [], choices: {} };
let shown = [], focus = 0;
const $ = (id) => document.getElementById(id);

function remember(key, value) { try { localStorage.setItem("hdreview." + key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem("hdreview." + key); } catch (e) { return null; } }

async function load() {
  state = await (await fetch("/api/state")).json();
  $("bulkopt").innerHTML = state.options.map(o => `<option value="${o}">${LABELS[o]}</option>`).join("") + `<option value="original">Keep original</option>`;
  for (const id of ["group", "show", "zoom"]) { const v = recall(id); if (v !== null) $(id).value = v; }
  render();
}

function filtered() {
  const g = $("group").value, s = $("show").value;
  return state.images.filter(im => (!g || im.group === g) &&
    (s === "all" || (s === "picked") === (im.key in state.choices)));
}

// Detail: every tile of a card shows the same 380x300 window of the image at full 2x size, and
// moving the mouse over any of them pans all of them -- for full-screen art, where whole images
// at a size that fits side by side are too small to judge.
const DETAIL = { w: 380, h: 300 };
function detailMode() { return $("zoom").value === "detail"; }

function pan(vp, event) {
  const box = vp.getBoundingClientRect();
  const fx = Math.min(Math.max((event.clientX - box.left) / box.width, 0), 1);
  const fy = Math.min(Math.max((event.clientY - box.top) / box.height, 0), 1);
  for (const img of vp.closest(".card").querySelectorAll(".vp img")) {
    const w = parseFloat(img.style.width) || img.naturalWidth, h = w * img.naturalHeight / img.naturalWidth;
    img.style.left = -fx * Math.max(w - DETAIL.w, 0) + "px";
    img.style.top = -fy * Math.max(h - DETAIL.h, 0) + "px";
  }
}

function tile(im, option, zoom) {
  const chosen = state.choices[im.key] === option;
  const num = option === "original" ? 0 : state.options.indexOf(option) + 1;
  const ready = option === "original" || im.ready.includes(option);
  const src = `/img/${option}/${encodeURIComponent(im.key)}.png`;
  const img = `<img loading="lazy" src="${src}" alt="${LABELS[option]}" data-zoom="${zoom}" onload="sizeImg(this)">`;
  const body = !ready
    ? `<div class="pending" style="width:${detailMode() ? DETAIL.w : 140 * zoom}px;height:${detailMode() ? DETAIL.h : 134 * zoom}px">rendering…</div>`
    : detailMode() ? `<div class="vp" onmousemove="pan(this, event)">${img}</div>` : img;
  return `<div class="tile ${option === "original" ? "orig" : ""} ${chosen ? "chosen" : ""}" data-key="${im.key}" data-option="${option}">
    ${body}<div class="cap">${num} · ${LABELS[option]}</div></div>`;
}

function sizeImg(img) {
  const z = parseFloat(img.dataset.zoom), orig = img.closest(".tile").classList.contains("orig");
  const base = orig ? 2 : 1;                       // originals are half size: show them at 2x too
  img.style.width = img.naturalWidth * base * z / 2 + "px";
}

function render() {
  const zoom = detailMode() ? 2 : parseFloat($("zoom").value);
  shown = filtered();
  focus = Math.min(focus, Math.max(shown.length - 1, 0));
  $("list").innerHTML = shown.length ? shown.map((im, i) => {
    const pick = state.choices[im.key];
    return `<section class="card ${i === focus ? "focus" : ""}" data-i="${i}">
      <h2>${im.key.replace("__", " / ")} <span class="state ${pick ? "picked" : ""}">${pick ? "picked: " + LABELS[pick] : "not picked"}</span></h2>
      <div class="tiles">${["original", ...state.options].map(o => tile(im, o, zoom)).join("")}</div></section>`;
  }).join("") : `<div class="empty">Nothing here. Change the filters above.</div>`;
  const picked = Object.keys(state.choices).length;
  $("count").textContent = picked; $("total").textContent = state.images.length;
  $("fill").style.width = (state.images.length ? 100 * picked / state.images.length : 0) + "%";
}

async function choose(keys, choice) {
  const r = await fetch("/api/choose", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ keys, choice }) });
  if (!r.ok) { alert("Could not save that pick."); return false; }
  for (const k of keys) { if (choice === null) delete state.choices[k]; else state.choices[k] = choice; }
  return true;
}

function scrollToFocus() {
  const el = document.querySelector(`.card[data-i="${focus}"]`);
  if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

async function pickFocused(choice) {
  const im = shown[focus]; if (!im) return;
  if (!(await choose([im.key], choice))) return;
  const keep = $("show").value !== "unpicked";      // in the unpicked view the card leaves the list
  if (keep) focus = Math.min(focus + 1, shown.length - 1);
  render(); scrollToFocus();
}

$("list").addEventListener("click", async (e) => {
  const t = e.target.closest(".tile"); if (!t) return;
  focus = shown.findIndex(im => im.key === t.dataset.key);
  await pickFocused(t.dataset.option);
});
document.addEventListener("keydown", async (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "j" || e.key === "ArrowDown") { focus = Math.min(focus + 1, shown.length - 1); render(); scrollToFocus(); e.preventDefault(); }
  else if (e.key === "k" || e.key === "ArrowUp") { focus = Math.max(focus - 1, 0); render(); scrollToFocus(); e.preventDefault(); }
  else if (e.key === "0") await pickFocused("original");
  else if (/^[1-9]$/.test(e.key) && state.options[+e.key - 1]) await pickFocused(state.options[+e.key - 1]);
  else if (e.key === "u") { const im = shown[focus]; if (im && await choose([im.key], null)) render(); }
});
for (const id of ["group", "show", "zoom"]) $(id).addEventListener("change", () => { remember(id, $(id).value); focus = 0; render(); });
$("bulk").addEventListener("click", async () => {
  const opt = $("bulkopt").value, keys = shown.filter(im => !(im.key in state.choices)).map(im => im.key);
  if (!keys.length) return;
  if (!confirm(`Set ${keys.length} unpicked image(s) to "${LABELS[opt]}"?`)) return;
  if (await choose(keys, opt)) render();
});
setInterval(async () => {                               // pick up renders as they finish
  const fresh = await (await fetch("/api/state")).json();
  const before = state.images.reduce((n, im) => n + im.ready.length, 0);
  const after = fresh.images.reduce((n, im) => n + im.ready.length, 0);
  if (after !== before) { state.images = fresh.images; render(); }
}, 15000);
load();
</script>
</body>
</html>

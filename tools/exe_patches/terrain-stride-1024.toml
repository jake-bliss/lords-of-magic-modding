# Texture rows 1024 bytes wide instead of 512: the rasterizer's only assumption about atlas width.
#
# Every textured span in the terrain rasterizer (0x512710-0x5179da, 18 span loops) fetches a texel as
#
#     texel = atlas[((v >> 7) & ~0x1ff) + (u >> 16)]        u, v in 16.16 texels
#
# i.e. row = floor(v) * 512. u carries no wrap mask, so the column needs no change; only the row
# stride does. For a 1024-wide atlas that is (v >> 6) & ~0x3ff = floor(v) * 1024. Both edits keep
# the instruction length, so nothing moves.
#
# All 18 sites are generated from the binary by the scan below, not transcribed, and the scan runs
# again at build time: exactly 18 occurrences before, zero after, and 18 in the finished form. The same pattern occurs nowhere
# else in the executable (whole-file search, 2026-09-24), so no other code path samples a 512-wide
# texture this way.
#
# Applies to EVERY atlas at once. There is one texture page format, so every .lbm a .til names must
# be 1024 wide with this set in, and 512 wide without it. tilesa01.til draws from tilesb01.lbm.

[target]
sha256 = "a505f399d5be73fe0a2215633f663717f28daeb3075bbcc05b47d40653669052"

[[scan]]
start = 0x512710
end = 0x5179da
regex = '\xc1[\xf8-\xff]\x07(?:\x81[\xe0-\xe7]|\x25)\x00\xfe\xff\xff'
after = '\xc1[\xf8-\xff]\x06(?:\x81[\xe0-\xe7]|\x25)\x00\xfc\xff\xff'
count = 18

[[patch]]
va = 0x512aa9
old = "c1 fb 07"
new = "c1 fb 06"
what = "site 1: sar ebx,7 -> sar ebx,6"

[[patch]]
va = 0x512aac
old = "81 e3 00 fe ff ff"
new = "81 e3 00 fc ff ff"
what = "site 1: and ebx,0xfffffe00 -> and ebx,0xfffffc00"


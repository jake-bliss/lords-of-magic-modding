# HD terrain, hybrid: the game stays 640x480 and only the terrain rasterizes at 2x.
#
# The map render surface becomes a 2x-resolution image of the stock 1x surface space. Only two things
# know that: the rasterizer's vertex setup (512350 and 518c50 build 16.16 positions with shl 16; shl 17
# doubles the drawn geometry and nothing else), and the fork's ddraw.dll, which doubles every rect or
# point on the map-surface side of a Blt/BltFast and downsamples map->back-buffer copies 2:1, keeping
# the 2x pixels to composite at present time. Every other coordinate -- camera, dirty lists, culling,
# picking, sprites, the frame -- stays stock, so viewport-2x, terrain-render-2x and sprites-2x are NOT
# used with this set. terrain-stride-1024.toml is (the 2x atlases need it).
#
# Surface: 4m+1280 x 4m+768 = 1520x1008 at margin 60 (not 2m+1280): the movie save/restore and the
# start screen use the map surface as a 640x480 scratch buffer, which the DLL doubles to 1280x960.
#
# Static analysis 2026-09-24 (scratchpad hybrid-analysis.md, archived beside lomse.asm in
# backups/terrain-hd-20260924). Edges keep 1x precision: vertex positions are whole 1x pixels, so they
# land on even 2x pixels; texture interiors get full 2x texel density.

[target]
sha256 = "a505f399d5be73fe0a2215633f663717f28daeb3075bbcc05b47d40653669052"


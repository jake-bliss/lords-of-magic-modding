# The 3D map's render path at 1280x768: every map-viewport and map-surface extent that is not
# already in viewport-2x.toml. Use the two sets together.
#
# The map renders into a surface of (2*margin + 640) x (2*margin + 384) -- 760x504 at the stock
# margin of 60 -- and the scroll, redraw and dirty-rect code carries that size as literals, not as a
# read of the surface: 639/383 (right/bottom), 640/384 (widths), and 2m+639/2m+383. viewport-2x.toml
# doubles the surface; these sites are the code that still believes it is 760x504. Missing them does
# not crash -- it leaves unrendered or stale bands along the right and bottom after a scroll.
#
# Sites come from a full classification of every 639/383/640/384/759/503 literal in the render
# path (backups/terrain-hd-20260924/literal-classification.md, 2026-09-24, static only): 87 rows
# applied here, high and medium confidence, all of one kind -- a map-viewport or map-surface extent.
#
# 🔴 THE RASTERIZER CLIP IS A CONSTANT, NOT A FUNCTION OF THE SURFACE. The ctor writes 759/503
# (here 1399/887) and nothing ever recomputes it -- not even the script op that rebuilds the surface
# with new margins (0x51af05/0x51af0e, patched below). That is true of the stock game too: a margin
# other than 60 leaves a band unrendered (larger) or lets the rasterizer write past the surface
# (smaller). 1399/887 is right only while the margin stays 60.
#
# The full-screen dirty-list clips and the recentre invalidate are frame-space and live in
# viewport-2x.toml; 0x500152 below depends on 0x4ff150 there (mode-8 copies its right edge).
#
# HELD BACK, deliberately -- each is a candidate for a rung-0 symptom, not a guess to pre-apply:

#   0x5190f6 MODE8/medium: same, when per-player mode [0x5a8078]==8 (480-tall map view); patch only if that mode is in scope
#   0x51a87a ALT/low: camera-bound setter: NOP the sar (doubles bound, = (2w-1280)/2) instead of touching 640/384; bounds x = (w-640)/2 -> w-640
#   0x51a88d ALT/low: camera-bound setter: NOP the sar (doubles bound, = (2w-1280)/2) instead of touching 640/384; bounds y = (h-384)/2 -> h-384
#   0x51a8df ALT/low: camera-bound setter: NOP the sar (doubles bound, = (2w-1280)/2) instead of touching 640/384; bounds (640-a*640)/2 -> 640-a*640
#   0x51a90d ALT/low: camera-bound setter: NOP the sar (doubles bound, = (2w-1280)/2) instead of touching 640/384; (384-b*384)/2 -> 384-b*384
#   0x51a90f ALT/low: camera-bound setter: NOP the sar (doubles bound, = (2w-1280)/2) instead of touching 640/384; (a*640-640)/2 -> a*640-640
#   0x51a911 ALT/low: camera-bound setter: NOP the sar (doubles bound, = (2w-1280)/2) instead of touching 640/384; (b*384-384)/2 -> b*384-384
#   0x5001ae MODE8/medium: entering mode 8: map dirty-list clip bottom 479
#   0x4a31c3 OVERLAY/low: thick-pixel plotter into back buffer, clipped to map viewport: x<639-r
#   0x4a31d5 OVERLAY/low: thick-pixel plotter into back buffer, clipped to map viewport: y<383-r
#   0x4a32d0 OVERLAY/low: thick-pixel plotter into back buffer, clipped to map viewport: x<639-r
#   0x4a32e2 OVERLAY/low: thick-pixel plotter into back buffer, clipped to map viewport: y<383-r
#   0x505c06 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505c1b CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505c38 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505c49 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505c66 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505c77 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505c94 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x505ca0 CAMUNIT/medium: script camera-pan clamp on map camera 0x587874/78 (+-2880 x, +-1520 y) in projected-pixel units, which double
#   0x430531 LEAVE/low: widget invalidate rect clamped to y<=383 (UI space); leave
#
# The camera works in projected screen pixels, which double with the viewport, so script pan clamps
# (CAMUNIT) and the camera-bound setters (ALT) will likely need attention once the view is right.
# Mode 8 (a 480-tall map view) is unresolved.


# The frame at 1280x960 and the 3D map viewport at 1280x768 -- the set run on 2026-09-22.
#
# On its own this MAGNIFIES the map 2x: the NDC-to-viewport mapping doubles, so the same world span
# covers twice the pixels (PR #83's "tier 3"). mods/map-2x-viewport halves the camera zoom to turn
# that into "twice the world at the same scale"; HD terrain wants the opposite -- keep the zoom and
# feed the magnified view 2x texels 1:1. So this set is used WITHOUT that mod here.
#
# Sprites and the interface are untouched: they draw at 640x480 in the top-left of the 1280x960
# frame. That is expected for the terrain proof, not a defect of it.
#
# Values and sites: docs/resolution-and-upscaling.md and the 2x-UI notes. Each is re-read from the
# binary by tools/exe_patch.py before anything is written.

[target]
sha256 = "a505f399d5be73fe0a2215633f663717f28daeb3075bbcc05b47d40653669052"

# --- the frame -----------------------------------------------------------------------------------

[[patch]]
va = 0x47526c
old = "68 e0 01 00 00"
new = "68 c0 03 00 00"
what = "surface 0 height 480 -> 960"

[[patch]]
va = 0x475273
old = "68 80 02 00 00"
new = "68 00 05 00 00"
what = "surface 0 width 640 -> 1280"

[[patch]]
va = 0x47530d
old = "68 e0 01 00 00"
new = "68 c0 03 00 00"
what = "surface 1 (primary) height 480 -> 960"

[[patch]]
va = 0x475312
old = "68 80 02 00 00"
new = "68 00 05 00 00"
what = "surface 1 (primary) width 640 -> 1280"

[[patch]]
va = 0x4fdb3e
old = "c7 86 e8 2f 02 00 80 02 00 00"
new = "c7 86 e8 2f 02 00 00 05 00 00"
what = "app object width 640 -> 1280"

[[patch]]
va = 0x4fdb48
old = "c7 86 ec 2f 02 00 e0 01 00 00"
new = "c7 86 ec 2f 02 00 c0 03 00 00"
what = "app object height 480 -> 960"

# --- the 3D viewport -----------------------------------------------------------------------------

old = "00 00 a0 43"
new = "00 00 20 44"
what = "NDC x scale 320.0f -> 640.0f"

[[patch]]
va = 0x54d7d8
old = "00 00 a0 c3"
new = "00 00 20 c4"
what = "NDC x offset -320.0f -> -640.0f (screen_x = ndc_x*320 - (-320); fsub at 0x469b81)"

[[patch]]

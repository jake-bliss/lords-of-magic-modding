<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait Review</title>
<style>
  /* image-rendering: pixelated is load-bearing, not decoration. Browsers smooth upscaled images
     by default, which would blur the ORIGINAL tile into looking like a resample and make the whole
     comparison meaningless. Every tile must show real pixels. */
  :root{
    --bg:#15161a; --panel:#1d1f25; --line:#2c2f38; --ink:#e8e9ec; --dim:#9aa0ab;
    --keep:#34c36b; --reject:#e05260; --accent:#ffd77a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);
         background:var(--panel);flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .spacer{flex:1}
  .stat{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}
  .stat b{color:var(--ink);font-weight:600}
  .stat .k{color:var(--keep)} .stat .r{color:var(--reject)}
  button,select{background:#262933;color:var(--ink);border:1px solid var(--line);border-radius:7px;
                padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:#3d4250}
  button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}

  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;min-width:0}
  .pair{display:flex;gap:28px;align-items:flex-start}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tile canvas,.tile img{image-rendering:pixelated;display:block;background:#0d0e11;
                         border:1px solid var(--line);border-radius:3px}
  .cap{font-size:12px;color:var(--dim);letter-spacing:.3px;text-transform:uppercase}
  .cap b{color:var(--ink)}
  #name{font-size:13px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #verdictbar{display:flex;gap:10px;align-items:center}
  .vbtn{padding:9px 20px;font-weight:600;font-size:14px}
  .vbtn.keep.on{background:var(--keep);border-color:var(--keep);color:#0c1a10}
  .vbtn.reject.on{background:var(--reject);border-color:var(--reject);color:#1d0b0d}
  .hint{color:var(--dim);font-size:12px}
  kbd{background:#2b2f3a;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
      padding:1px 5px;font:inherit;font-size:11px;font-family:ui-monospace,Menlo,monospace}

  aside{width:290px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
  .thumb{position:relative;cursor:pointer;border:2px solid transparent;border-radius:4px;overflow:hidden;line-height:0}
  .thumb img{width:100%;image-rendering:pixelated;display:block}
  .thumb.cur{border-color:var(--accent)}
  .thumb.keep{border-color:var(--keep)} .thumb.reject{border-color:var(--reject)}
  .thumb.keep::after,.thumb.reject::after{content:'';position:absolute;inset:0;background:currentColor;opacity:.16}
  .thumb.keep::after{color:var(--keep)} .thumb.reject::after{color:var(--reject)}
  @media (max-width:900px){aside{display:none}}
</style>
</head>
<body>
<header>
  <h1>Portrait review</h1>
  <span class="stat" id="pos"></span>
  <span class="stat" id="tally"></span>
  <span class="spacer"></span>
  <select id="filter" title="Which portraits to step through">
    <option value="all">All</option>
    <option value="todo">Unreviewed only</option>
    <option value="keep">Kept</option>
    <option value="reject">Rejected</option>
  </select>
  <button id="zoom">Zoom 2&times;</button>
  <button id="blink" title="Hold to flip the right tile to the original">A/B flip</button>
  <button id="export">Export JSON</button>
</header>

<main>
  <div id="stage">
    <div id="name"></div>
    <div class="pair">
      <div class="tile">
        <img id="imgA" alt="original">
        <div class="cap">Original <b>70&times;67</b></div>
      </div>
      <div class="tile">
        <img id="imgB" alt="upscaled">
        <div class="cap" id="capB">Upscaled <b>140&times;134</b></div>
      </div>
    </div>
    <div id="verdictbar">
      <button class="vbtn keep"   id="bKeep">Keep</button>
      <button class="vbtn reject" id="bReject">Reject</button>
      <button class="vbtn"        id="bClear">Unmark</button>
    </div>
    <div class="hint">
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>K</kbd> keep &nbsp; <kbd>X</kbd> reject &nbsp;
      <kbd>U</kbd> unmark &nbsp; <kbd>Space</kbd> hold to flip &nbsp; <kbd>Z</kbd> zoom
    </div>
  </div>
  <aside><div id="grid"></div></aside>
</main>

<script>
const S = { items: [], verdicts: {}, i: 0, zoom: 2, filter: 'all', flipping: false };
const $ = id => document.getElementById(id);

// Both tiles are 140x134 sources, so one zoom factor keeps them the same physical size. The
// original was rendered at 2x NEAREST upstream precisely so this comparison is "same size on
// screen", which is the only comparison that matches what the game will show.
const SIDE = { w: 140, h: 134 };

async function boot () {
  S.items = await (await fetch('manifest.json')).json();
  try { S.verdicts = await (await fetch('/verdicts')).json(); }
  catch { try { S.verdicts = JSON.parse(localStorage.getItem('lom.portrait.verdicts') || '{}'); } catch { S.verdicts = {}; } }
  buildGrid();
  const firstTodo = S.items.findIndex(it => !S.verdicts[it.id]);
  S.i = firstTodo === -1 ? 0 : firstTodo;
  render();
}

function visible () {
  if (S.filter === 'all') return S.items;
  if (S.filter === 'todo') return S.items.filter(it => !S.verdicts[it.id]);
  return S.items.filter(it => S.verdicts[it.id] === S.filter);
}

function buildGrid () {
  const g = $('grid');
  g.innerHTML = '';
  S.items.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.dataset.id = it.id;
    d.title = it.member;
    d.innerHTML = `<img src="images/${it.id}.new.png" loading="lazy" alt="">`;
    d.onclick = () => { S.i = idx; render(); };
    g.appendChild(d);
  });
}

function render () {
  const it = S.items[S.i];
  if (!it) return;
  const w = SIDE.w * S.zoom, h = SIDE.h * S.zoom;
  for (const el of [$('imgA'), $('imgB')]) { el.width = w; el.height = h; }
  $('imgA').src = `images/${it.id}.orig.png`;
  $('imgB').src = S.flipping ? `images/${it.id}.orig.png` : `images/${it.id}.new.png`;
  $('capB').innerHTML = S.flipping ? 'Original <b>(flipped)</b>' : 'Upscaled <b>140&times;134</b>';
  $('name').textContent = it.member;

  const v = S.verdicts[it.id] || null;
  $('bKeep').classList.toggle('on', v === 'keep');
  $('bReject').classList.toggle('on', v === 'reject');

  const done = Object.keys(S.verdicts).length;
  const keeps = Object.values(S.verdicts).filter(x => x === 'keep').length;
  $('pos').innerHTML = `<b>${S.i + 1}</b> / ${S.items.length}`;
  $('tally').innerHTML =
    `reviewed <b>${done}</b> &middot; <span class="k">keep ${keeps}</span> &middot; <span class="r">reject ${done - keeps}</span>`;
  $('zoom').textContent = `Zoom ${S.zoom}×`;

  document.querySelectorAll('.thumb').forEach((d, idx) => {
    d.className = 'thumb' + (idx === S.i ? ' cur' : '') + (S.verdicts[d.dataset.id] ? ' ' + S.verdicts[d.dataset.id] : '');
  });
  const cur = document.querySelector('.thumb.cur');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function setVerdict (v) {
  const it = S.items[S.i];
  if (!it) return;
  if (v === null) delete S.verdicts[it.id]; else S.verdicts[it.id] = v;
  // Two sinks on purpose: the POST is the record I can read back, localStorage is the fallback if
  // the page is ever opened without the server.
  try { localStorage.setItem('lom.portrait.verdicts', JSON.stringify(S.verdicts)); } catch {}
  fetch('/verdict', { method: 'POST', body: JSON.stringify({ id: it.id, verdict: v }) }).catch(() => {});
  if (v !== null) step(1); else render();
}

function step (d) {
  const list = visible();
  if (!list.length) { render(); return; }
  const here = list.findIndex(x => x.id === S.items[S.i].id);
  let next = here === -1 ? 0 : here + d;
  next = Math.max(0, Math.min(list.length - 1, next));
  S.i = S.items.indexOf(list[next]);
  render();
}

$('bKeep').onclick   = () => setVerdict('keep');
$('bReject').onclick = () => setVerdict('reject');
$('bClear').onclick  = () => setVerdict(null);
$('zoom').onclick    = () => { S.zoom = S.zoom === 3 ? 1 : S.zoom + 1; render(); };
$('filter').onchange = e => { S.filter = e.target.value; step(0); };
$('export').onclick  = () => {
  const rows = S.items.map(it => `${it.member}\t${S.verdicts[it.id] || ''}`).join('\n');
  const blob = new Blob(['member\tverdict\n' + rows], { type: 'text/tab-separated-values' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'portrait-verdicts.tsv';
  a.click();
};
const flipOn  = () => { if (!S.flipping) { S.flipping = true;  render(); } };
const flipOff = () => { if (S.flipping)  { S.flipping = false; render(); } };
$('blink').onmousedown = flipOn;
$('blink').onmouseup = $('blink').onmouseleave = flipOff;

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright') { step(1); e.preventDefault(); }
  else if (k === 'arrowleft') { step(-1); e.preventDefault(); }
  else if (k === 'k' || k === 'y') setVerdict('keep');
  else if (k === 'x' || k === 'n') setVerdict('reject');
  else if (k === 'u') setVerdict(null);
  else if (k === 'z') { S.zoom = S.zoom === 3 ? 1 : S.zoom + 1; render(); }
  else if (e.code === 'Space') { flipOn(); e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.code === 'Space') flipOff(); });

boot();
</script>
</body>
</html>
